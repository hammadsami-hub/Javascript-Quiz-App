<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Quiz</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">

        <!-- START SCREEN -->
        <section id="start-screen" class="quiz-card text-center">
          <h1 class="display-6 fw-bold mb-3">JavaScript Quiz</h1>
          <p class="text-muted mb-4">
            10 questions. 15 seconds each. Pick one answer, then move on.
          </p>
          <button id="start-btn" class="btn btn-primary btn-lg px-5">Start quiz</button>
        </section>

        <!-- QUIZ SCREEN -->
        <section id="quiz-screen" class="quiz-card d-none">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span id="question-count" class="fw-semibold">Question 1 of 10</span>
            <span id="timer" class="timer-badge">15s</span>
          </div>

          <div class="progress mb-4" role="progressbar" aria-label="Quiz progress">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>

          <h2 id="question-text" class="h4 mb-4"></h2>

          <div id="options" class="d-grid gap-2 mb-4"></div>

          <div class="d-flex justify-content-between align-items-center">
            <span id="score-live" class="text-muted">Score: 0</span>
            <button id="next-btn" class="btn btn-primary px-4" disabled>Next question</button>
          </div>
        </section>

        <!-- RESULT SCREEN -->
        <section id="result-screen" class="quiz-card text-center d-none">
          <h2 class="fw-bold mb-2">Quiz complete</h2>
          <p id="result-score" class="result-score mb-1"></p>
          <p id="result-message" class="text-muted mb-4"></p>
          <button id="restart-btn" class="btn btn-primary btn-lg px-5">Play again</button>
        </section>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional, for components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own script -->
  <script src="script.js"></script>
</body>
</html>
